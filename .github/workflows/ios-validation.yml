name: iOS validation

on:
  push:
    branches: [main, 'ios-resubmission-*']
    paths: ['src/**', 'public/**', 'ios/**', 'scripts/check_ios.py', 'scripts/check_ios_launch.py', 'package*.json', 'capacitor.config.ts', 'vite.config.ts', 'vitest.config.ts', 'tsconfig*.json', '.github/workflows/ios-*.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Tests and native iPhone build
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify Xcode version
        run: |
          xcodebuild -version
          python3 -c 'import subprocess; v=subprocess.check_output(["xcodebuild","-version"],text=True).split()[1]; assert int(v.split(".")[0]) >= 26, "Xcode 26 or newer is required"'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run ios:sync
      - name: Compile native iOS app
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build | tee ios-build.log
      - name: Launch on iPhone simulator
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone") and d["isAvailable"]))')
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          finish() {
            xcrun simctl spawn "$simulator_id" log show --last 5m --style compact --predicate 'process == "App"' > ios-runtime.log 2>&1 || true
            xcrun simctl shutdown "$simulator_id" || true
          }
          trap finish EXIT
          xcrun simctl install "$simulator_id" ios/DerivedData/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$simulator_id" shop.stylst.app
          for attempt in {1..8}; do
            sleep 10
            xcrun simctl io "$simulator_id" screenshot ios-launch.png
            if python3 scripts/check_ios_launch.py ios-launch.png; then
              exit 0
            fi
          done
          echo 'STYLST remained blank after waiting for native startup.' >&2
          exit 1
      - name: Save native build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-validation-${{ github.sha }}
          path: |
            ios-build.log
            ios-launch.png
            ios-runtime.log
          retention-days: 14
          if-no-files-found: ignore
